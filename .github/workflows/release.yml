name: Release
on:
  push:
    tags:
    - 'v*'
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      GOPATH: ${{ github.workspace }}
      GO111MODULE: off
    steps:
    - name: Install Go
      uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 #v2.2.20
      with:
        go-version: 1.12.x
    - name: Checkout code
      uses: actions/checkout@7884fcad6b5d53d10323aee724dc68d8b9096a2e #v2.4.2
      with:
        path: ./src/github.com/${{ github.repository }}
    - name: Build
      run: go build
      working-directory: ${{ github.workspace }}/src/github.com/${{ github.repository }}
    - name: Package
      run:  tar cvzf hub-xmlrpc-api-linux-amd64.tar.gz hub-xmlrpc-api README.md
      working-directory: ${{ github.workspace }}/src/github.com/${{ github.repository }}
    - name: Create a Release
      uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e #v1.1.4 WARNING: Deprecated and archived! See the repository!
      id: create_release
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
         tag_name: ${{ github.ref }}
         release_name: ${{ github.ref }}
    
    - name: Upload Release Asset
      id: upload-release-asset 
      uses: actions/upload-release-asset@64e5e85fc528f162d7ba7ce2d15a3bb67efb3d80 #v1.0.1 WARNING: Deprecated and archived! See the repository!
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./src/github.com/${{ github.repository }}/hub-xmlrpc-api-linux-amd64.tar.gz
          asset_name: hub-xmlrpc-api-linux-amd64.tar.gz
          asset_content_type: application/gzip
